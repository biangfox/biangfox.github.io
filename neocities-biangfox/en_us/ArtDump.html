  <div margin-left=25%>
    <script>
    function randomize(values) {
    let index = values.length,
      randomIndex;
  
      // While there remain elements to shuffle.
      while (index != 0) {
        // Pick a remaining element.
        randomIndex = Math.floor(Math.random() * index);
        index--;
    
        // And swap it with the current element.
        [values[index], values[randomIndex]] = [values[randomIndex], values[index]];
      }
    
      return values;
    }
    const files = ["tallme.png","chirp.png","eepy.png","natedressup.png","big and intimidating tail.png","sillyme.png","witchelix.png","yanny.png","jay.png","flickeringpose.png", "apollyon.png", "blahaj.png"];
    randomize(files).forEach(file => {
        document.body.innerHTML += `<img src="../artdumps/${file}" class=artdump>`;
    });
    </script>
