  <div margin-left=25%>
    <script>
    function randomize(values) {
  for (let index = values.length; index > 0; index--) {
    const randomIndex = Math.floor(Math.random() * index);

    [values[index - 1], values[randomIndex]] = [
      values[randomIndex],
      values[index - 1]
    ];
  }

  return values;
}

fetch("../artdumps/artfiles.json")
  .then(response => response.json())
  .then(files => {
    randomize(files).forEach(file => {
      const image = document.createElement("img");
      image.src = `../artdumps/${encodeURIComponent(file)}`;
      image.alt = file;
      image.classList.add("artdump");

      document.body.appendChild(image);
    });
  })
  .catch(error => {
    console.error("Could not load artwork:", error);
  });
    </script>
  </div>
</body>
